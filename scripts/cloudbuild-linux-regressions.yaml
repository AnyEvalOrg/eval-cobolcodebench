steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/.build
        cp "$$(command -v docker)" /workspace/.build/docker
        docker run --rm --memory=2g --pids-limit=128 --user=0:0 --cap-drop=ALL \
          --cap-add=SETUID --cap-add=SETGID --cap-add=KILL --cap-add=CHOWN \
          --cap-add=DAC_OVERRIDE --cap-add=SYS_PTRACE --security-opt=no-new-privileges:true \
          -v /workspace:/workspace \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e PATH=/workspace/.build:/usr/local/bin:/usr/bin:/bin \
          -w /workspace '${_SANDBOX_IMAGE}' \
          /usr/local/bin/python3 scripts/linux_regressions.py --image '${_SANDBOX_IMAGE}' --docker-cli /workspace/.build/docker
substitutions:
  _SANDBOX_IMAGE: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-cobol-sandbox:1.0.0
# The outer container tests bytes/forks; the script launches a sibling with a
# 2 GiB memory cgroup, disk-backed /tmp, read-only root and /dev/shm, and
# 128 PIDs. Includes retained unlinked files, memfds, 50k empty entries and
# denied /dev/shm writes, plus all previous memory/disk cases, using this socket.
timeout: 600s
