[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-cobolcodebench"
version = "1.0.0"
description = "CobolCodeBench file-based code generation and completion, packaged offline for AnyEval and Inspect"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["markdown-it-py>=3,<5"]

[project.optional-dependencies]
# AnyEval requirements give ranges; these are its installed, resolved versions.
inspect = ["inspect_ai==0.3.260"]
anyeval = ["inspect_ai==0.3.260", "inspect-evals==0.19.0", "inspect-k8s-sandbox==0.13.0"]
test = ["inspect_ai==0.3.260", "inspect-k8s-sandbox==0.13.0", "pytest>=8", "PyYAML>=6", "jsonschema>=4"]

# Inspect discovers this import before resolving either cobolcodebench task.
[project.entry-points.inspect_ai]
cobolcodebench = "cobolcodebench"

[tool.setuptools]
packages = ["cobolcodebench"]
include-package-data = true
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.package-data]
cobolcodebench = ["data/*.gz", "data/*.json", "*.yaml", "Dockerfile", "chart/*.yaml", "chart/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --basetemp=.build/pytest-tmp"
