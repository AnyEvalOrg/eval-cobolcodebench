# AnyEval chart default values; provider chart is an explicit exception.
# AnyEval: set INSPECT_K8S_DEFAULT_NAMESPACE=anyeval-sandbox.
global:
  nameOverride: ""
  fullnameOverride: ""
automountServiceAccountToken: false
serviceAccountCreate: false
allowDomains: []
allowEntities: []
allowCIDR: []
services:
  default:
    # Cloud Build tag matches pyproject.toml; AnyEval pins the digest in its catalog.
    image: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-cobol-sandbox:1.0.0
    command: ["sleep", "infinity"]
    workingDir: /tmp
    runtimeClassName: gvisor
    nodeSelector:
      cloud.google.com/gke-spot: "true"
    networkIsolated: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["SETUID", "SETGID", "KILL", "CHOWN", "DAC_OVERRIDE"]
      seccompProfile:
        type: RuntimeDefault
    # Equal CPU/memory requests and limits give Guaranteed QoS. Budget:
    # 768 MiB aggregate candidate RSS + one 50 ms allocation burst, writable
    # file page cache, /dev/shm and supervisor/overhead must fit below 2 GiB.
    # Native AS/DATA remain 1 GiB per process; NPROC=64. gVisor ignores
    # oom_score_adj when choosing OOM victims, so it is not a safety boundary.
    # Read-only root; /tmp is DISK-backed emptyDir, sizeLimit 512 MiB as an
    # eviction backstop. Pod ephemeral-storage requests/limits are 1 GiB.
    # Every 100 ms the supervisor sums regular-file st_blocks*512 across ALL
    # /tmp and /dev/shm: watchdog budget 256 MiB + one 100 ms write burst.
    # gVisor gofer write throughput makes that burst small. Memory emptyDir
    # sizeLimit is not enforced as a tmpfs size under gVisor; do not rely on it.
    # /dev/shm remains Memory emptyDir sizeLimit 16 MiB and is watched too.
    # /tmp is writable/executable for GnuCOBOL/gcc and the shared Java tools.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
        # Includes candidate files, runtime and log overhead.
        ephemeral-storage: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 1Gi
# Standard NetworkPolicy is visible to AnyEval's provenance hook (which queries
# networking.k8s.io). The Autopilot cluster has no CiliumNetworkPolicy CRD;
# the custom AnyEval chart emits only this standard policy, including DNS denial.
additionalResources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: '{{ .Release.Name }}-cobolcodebench-deny-all'
      namespace: '{{ .Release.Namespace }}'
    spec:
      # Select THIS release's pod only. `podSelector: {}` selects every pod in the namespace,
      # including shared infrastructure such as the egress proxy, and starved it of egress.
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: '{{ .Release.Name }}'
      policyTypes: [Ingress, Egress]
      ingress: []
      egress: []
